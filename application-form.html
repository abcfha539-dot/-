<!doctype html><html lang="ar" dir="rtl" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إرسال تقديم | NovaRolePlay</title><link rel="icon" href="assets/images/logo-default.png"><link rel="stylesheet" href="assets/plugins/global/plugins.bundle.css"><link rel="stylesheet" href="assets/css/style.bundle.css"><link rel="stylesheet" href="assets/css/custom.css"></head><body class="app-blank bg-body h-auto min-h-100 position-relative"><nav class="fixed-top header navbar navbar-expand-lg"><div class="container py-3 d-flex align-items-center justify-content-between"><a href="index.html" class="navbar-brand"><img src="assets/images/logo-default.png" alt="NovaRolePlay"><span class="nova-brand-name">Nova<span>RolePlay</span></span></a><div class="d-flex gap-2 align-items-center"><a href="application.html" class="btn btn-light btn-sm rounded-pill">العودة للتقديمات</a><a href="login.html" class="btn btn-danger btn-sm rounded-pill nova-login-btn"><i class="fa-brands fa-discord me-1"></i>تسجيل دخول</a></div></div></nav><header class="apps-hero" style="padding:135px 0 45px;background:linear-gradient(180deg,#090a11b8,#090a11),url('assets/images/hero-nova.jpg') center/cover"><div class="container"><span class="text-danger fw-bold">NOVAROLEPLAY</span><h1 class="display-5 fw-bold mt-2">نموذج التقديم</h1><p class="text-gray-400">املأ البيانات بدقة، وسيظهر طلبك في لوحة إدارة NovaRolePlay.</p></div></header><main class="container py-10"><div class="nova-form-wrap"><div class="nova-panel"><div id="form-closed" class="alert alert-danger d-none">هذا التقديم مغلق حاليًا.</div><form id="nova-application-form"><div class="mb-5"><label for="appType">نوع التقديم</label><select id="appType" name="type" required></select></div><div class="mb-5"><label for="playerName">اسمك داخل اللعبة</label><input id="playerName" name="playerName" required maxlength="80" placeholder="اسم الشخصية"></div><div class="mb-5"><label for="discord
